services:
  - type: web
    name: whatever-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AMAP_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DB_PATH
        value: /tmp/p003.db
